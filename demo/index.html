<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Canvas — 3D Visualization</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    overflow: hidden;
    height: 100vh;
  }

  #app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── 左侧对话面板 ──────────────────────────── */
  .sidebar {
    flex: 1;
    min-width: 200px;
    background: #111118;
    border-right: none;
    display: flex;
    flex-direction: column;
    z-index: 10;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid #222;
  }

  .sidebar-header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .sidebar-header .subtitle {
    font-size: 11px;
    color: #666;
    margin-top: 4px;
  }

  .stats-bar {
    display: flex;
    gap: 12px;
    padding: 10px 20px;
    border-bottom: 1px solid #222;
    font-size: 11px;
    color: #888;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .stat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  /* ── 对话区域 ──────────────────────────────── */
  .conversation {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }

  .conversation::-webkit-scrollbar { width: 4px; }
  .conversation::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .turn {
    margin-bottom: 20px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .turn-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .turn-label.user { color: #4A90D9; }
  .turn-label.coach { color: #50C878; }

  .turn-text {
    font-size: 13px;
    line-height: 1.6;
    color: #ccc;
  }

  .turn-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #333, transparent);
    margin: 16px 0;
  }

  /* ── 对话输入框 ────────────────────────────── */
  .chat-input-area {
    padding: 12px 16px;
    border-top: 1px solid #222;
    background: #0e0e16;
  }

  .chat-input-wrapper {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .chat-input-wrapper textarea {
    flex: 1;
    background: #1a1a26;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 13px;
    font-family: inherit;
    padding: 8px 12px;
    resize: none;
    outline: none;
    line-height: 1.5;
    transition: border-color 0.15s;
  }

  .chat-input-wrapper textarea:focus {
    border-color: #4A90D9;
  }

  .chat-input-wrapper textarea::placeholder {
    color: #555;
  }

  #chat-send {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #4A90D9;
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  #chat-send:hover {
    background: #3a7bc8;
  }

  .chat-hint {
    font-size: 10px;
    color: #555;
    margin-top: 6px;
    text-align: center;
  }

  /* ── 节点选择器 ────────────────────────────── */
  .node-selector {
    border-top: 1px solid #222;
    display: flex;
    flex-direction: column;
    max-height: 40vh;
    overflow: hidden;
  }

  .ns-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid #222;
  }

  .ns-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #666;
  }

  .ns-actions {
    display: flex;
    gap: 6px;
  }

  .ns-actions button {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #333;
    background: transparent;
    color: #888;
    cursor: pointer;
    transition: all 0.15s;
  }

  .ns-actions button:hover {
    background: #1a1a26;
    color: #fff;
    border-color: #4A90D9;
  }

  .ns-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  .ns-list::-webkit-scrollbar { width: 3px; }
  .ns-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .ns-group-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    padding: 6px 16px 2px;
    color: #555;
  }

  .ns-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    cursor: pointer;
    transition: background 0.1s;
    font-size: 12px;
    color: #bbb;
  }

  .ns-item:hover {
    background: #1a1a26;
  }

  .ns-item.selected {
    background: #1a1a2e;
    color: #fff;
  }

  .ns-check {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1.5px solid #444;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 10px;
  }

  .ns-item.selected .ns-check {
    border-color: #4A90D9;
    background: #4A90D9;
    color: #fff;
  }

  .ns-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .ns-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ns-conf {
    font-size: 9px;
    color: #666;
    flex-shrink: 0;
  }

  /* ── 3D 视图区域 ───────────────────────────── */
  .canvas-3d {
    flex: 3;
    min-width: 300px;
    position: relative;
  }

  #graph-container {
    width: 100%;
    height: 100%;
  }

  /* ── 节点详情面板 ──────────────────────────── */
  .node-detail {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 300px;
    background: rgba(17, 17, 24, 0.95);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 16px;
    display: none;
    z-index: 20;
    backdrop-filter: blur(10px);
  }

  .node-detail.visible {
    display: block;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .node-detail-close {
    position: absolute;
    top: 8px;
    right: 12px;
    cursor: pointer;
    color: #666;
    font-size: 18px;
    line-height: 1;
  }

  .node-detail-close:hover { color: #fff; }

  .node-detail-type {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 3px;
    display: inline-block;
    margin-bottom: 8px;
  }

  .node-detail-label {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 8px;
  }

  .node-detail-content {
    font-size: 12px;
    line-height: 1.6;
    color: #aaa;
    margin-bottom: 10px;
  }

  .node-detail-meta {
    font-size: 11px;
    color: #666;
  }

  .node-detail-meta span {
    display: block;
    margin-bottom: 3px;
  }

  /* ── 控制栏 ──────────────────────────────── */
  .controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 20;
  }

  .controls button {
    padding: 6px 14px;
    background: rgba(17, 17, 24, 0.9);
    border: 1px solid #333;
    border-radius: 6px;
    color: #ccc;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    backdrop-filter: blur(10px);
  }

  .controls button:hover {
    background: rgba(30, 30, 44, 0.95);
    border-color: #555;
    color: #fff;
  }

  .controls button.active {
    border-color: #4A90D9;
    color: #4A90D9;
  }

  /* ── 回放进度条 ──────────────────────────── */
  .playback {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 20;
    background: rgba(17, 17, 24, 0.9);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 16px;
    backdrop-filter: blur(10px);
  }

  .playback-label {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
  }

  .playback input[type="range"] {
    width: 200px;
    accent-color: #4A90D9;
  }

  .playback-turn {
    font-size: 12px;
    font-weight: 600;
    color: #4A90D9;
    min-width: 60px;
  }

  /* ── 右栏面板 ─────────────────────────────── */
  .whiteboard-panel {
    flex: 2;
    min-width: 250px;
    display: flex;
    flex-direction: column;
    z-index: 10;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* Dark (blackboard) theme — default */
  .whiteboard-panel.dark {
    background: #0d0d14;
    color: #d8d8d8;
  }

  /* Light (whiteboard) theme */
  .whiteboard-panel.light {
    background: #ffffff;
    color: #333;
  }

  /* ── 拖拽分隔条 ────────────────────────────── */
  .resizer {
    width: 5px;
    cursor: col-resize;
    background: #222;
    flex-shrink: 0;
    transition: background 0.15s;
    position: relative;
    z-index: 15;
  }

  .resizer:hover, .resizer.active {
    background: #4A90D9;
  }

  .wb-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .whiteboard-panel.dark .wb-header { border-bottom: 1px solid #222; }
  .whiteboard-panel.light .wb-header { border-bottom: 1px solid #eee; }

  .wb-header h2 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .whiteboard-panel.dark .wb-header h2 { color: #e0e0e0; }
  .whiteboard-panel.light .wb-header h2 { color: #111; }

  .wb-pattern-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }

  .whiteboard-panel.dark .wb-pattern-badge { background: #1a2744; color: #5ba3f5; }
  .whiteboard-panel.light .wb-pattern-badge { background: #e8f0fe; color: #1a73e8; }

  .wb-theme-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid #444;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .whiteboard-panel.dark .wb-theme-btn { color: #aaa; border-color: #333; }
  .whiteboard-panel.dark .wb-theme-btn:hover { background: #1a1a26; color: #fff; }
  .whiteboard-panel.light .wb-theme-btn { color: #666; border-color: #ddd; }
  .whiteboard-panel.light .wb-theme-btn:hover { background: #f0f0f0; color: #111; }

  .wb-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 11px;
    flex-wrap: wrap;
  }

  .whiteboard-panel.dark .wb-toolbar { border-bottom: 1px solid #222; color: #777; }
  .whiteboard-panel.light .wb-toolbar { border-bottom: 1px solid #eee; color: #666; }

  .wb-toolbar .wb-count {
    flex: 1;
    min-width: 100px;
  }

  .wb-toolbar button {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .whiteboard-panel.dark .wb-toolbar button {
    background: #1a1a26;
    border: 1px solid #333;
    color: #aaa;
  }
  .whiteboard-panel.dark .wb-toolbar button:hover {
    background: #252536;
    border-color: #4A90D9;
    color: #fff;
  }
  .whiteboard-panel.light .wb-toolbar button {
    background: #f5f5f5;
    border: 1px solid #ddd;
    color: #333;
  }
  .whiteboard-panel.light .wb-toolbar button:hover {
    background: #e8e8e8;
    border-color: #bbb;
  }

  .wb-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    font-size: 13px;
    line-height: 1.7;
  }

  .whiteboard-panel.dark .wb-body { background: #0d0d14; color: #d0d0d0; }
  .whiteboard-panel.light .wb-body { background: #fff; color: #333; }

  .wb-body::-webkit-scrollbar { width: 4px; }
  .whiteboard-panel.dark .wb-body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  .whiteboard-panel.light .wb-body::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

  .wb-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-size: 13px;
    text-align: center;
    padding: 40px;
    line-height: 1.6;
  }

  .whiteboard-panel.dark .wb-empty { color: #555; }
  .whiteboard-panel.light .wb-empty { color: #999; }

  /* ── Document styles (theme-aware) ──────── */
  .wb-doc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  .wb-doc-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
    padding-bottom: 8px;
  }
  .dark .wb-doc-title { color: #f0f0f0; border-bottom: 3px solid #f0f0f0; }
  .light .wb-doc-title { color: #111; border-bottom: 3px solid #111; }

  .wb-doc-subtitle { font-size: 11px; margin-bottom: 20px; }
  .dark .wb-doc-subtitle { color: #666; }
  .light .wb-doc-subtitle { color: #888; }

  .wb-section { margin-bottom: 20px; }

  .wb-section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    padding-bottom: 4px;
  }
  .dark .wb-section-title { color: #777; border-bottom: 1px solid #1e1e2e; }
  .light .wb-section-title { color: #888; border-bottom: 1px solid #eee; }

  .wb-card {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
    border-radius: 6px;
    border-left: 4px solid #ccc;
    transition: background 0.15s;
  }
  .dark .wb-card { background: #12121e; }
  .dark .wb-card:hover { background: #181830; }
  .light .wb-card { background: #fafafa; }
  .light .wb-card:hover { background: #f0f4ff; }

  .wb-card-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 3px;
  }

  .wb-card-body { flex: 1; min-width: 0; }

  .wb-card-label { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .dark .wb-card-label { color: #e8e8e8; }
  .light .wb-card-label { color: #222; }

  .wb-card-desc { font-size: 11px; line-height: 1.5; }
  .dark .wb-card-desc { color: #888; }
  .light .wb-card-desc { color: #666; }

  .wb-card-meta { font-size: 10px; margin-top: 3px; }
  .dark .wb-card-meta { color: #555; }
  .light .wb-card-meta { color: #aaa; }

  .wb-card-badge {
    font-size: 9px; font-weight: 600; padding: 1px 6px; border-radius: 8px;
    text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; margin-top: 2px;
  }

  .wb-conf-high { background: #1b3a1b; color: #66bb6a; }
  .wb-conf-mid  { background: #3a2a10; color: #ffa726; }
  .wb-conf-low  { background: #3a1515; color: #ef5350; }
  .light .wb-conf-high { background: #e8f5e9; color: #2e7d32; }
  .light .wb-conf-mid  { background: #fff3e0; color: #e65100; }
  .light .wb-conf-low  { background: #fbe9e7; color: #c62828; }

  .wb-relation {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px; margin-bottom: 4px; font-size: 11px;
  }
  .dark .wb-relation { color: #999; }
  .light .wb-relation { color: #555; }

  .wb-relation-arrow { font-size: 14px; font-weight: 700; }

  .wb-relation-type {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    padding: 1px 6px; border-radius: 4px; letter-spacing: 0.5px;
  }

  .wb-verdict {
    margin-top: 16px; padding: 14px 16px; border-radius: 8px;
  }
  .dark .wb-verdict { background: #0e1428; border: 1px solid #1a2744; }
  .light .wb-verdict { background: #f8f9ff; border: 1px solid #e0e4f0; }

  .wb-verdict-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: #4A90D9; margin-bottom: 6px;
  }

  .wb-verdict-text { font-size: 14px; font-weight: 600; line-height: 1.5; }
  .dark .wb-verdict-text { color: #e0e0e0; }
  .light .wb-verdict-text { color: #222; }

  .wb-divider { height: 1px; margin: 16px 0; }
  .dark .wb-divider { background: linear-gradient(90deg, transparent, #2a2a3a, transparent); }
  .light .wb-divider { background: linear-gradient(90deg, transparent, #ddd, transparent); }

  .wb-flow-step { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }

  .wb-flow-num {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }

  .wb-flow-content { flex: 1; }

  .wb-flow-label { font-size: 13px; font-weight: 600; }
  .dark .wb-flow-label { color: #e0e0e0; }
  .light .wb-flow-label { color: #222; }

  .wb-flow-desc { font-size: 11px; margin-top: 2px; }
  .dark .wb-flow-desc { color: #777; }
  .light .wb-flow-desc { color: #666; }

  .wb-fork-container { display: flex; gap: 12px; margin-bottom: 12px; }

  .wb-fork-option { flex: 1; padding: 12px; border-radius: 8px; text-align: center; }
  .dark .wb-fork-option { border: 2px solid #222; }
  .dark .wb-fork-option:hover { border-color: #4A90D9; background: #0e1428; }
  .light .wb-fork-option { border: 2px solid #eee; }
  .light .wb-fork-option:hover { border-color: #4A90D9; background: #f8faff; }

  .wb-fork-label { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .dark .wb-fork-label { color: #e0e0e0; }
  .light .wb-fork-label { color: #222; }

  .wb-fork-desc { font-size: 10px; }
  .dark .wb-fork-desc { color: #666; }
  .light .wb-fork-desc { color: #888; }

  .wb-risk-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: stretch; }

  .wb-risk-left, .wb-risk-right { flex: 1; padding: 8px 10px; border-radius: 6px; font-size: 11px; }

  .wb-risk-center { display: flex; align-items: center; font-size: 18px; padding: 0 4px; }
  .dark .wb-risk-center { color: #444; }
  .light .wb-risk-center { color: #ccc; }

  .dark .wb-risk-left { background: #2a1515; border-left: 3px solid #e53935; color: #ef9a9a; text-align: right; }
  .dark .wb-risk-right { background: #152a15; border-left: 3px solid #43a047; color: #a5d6a7; }
  .light .wb-risk-left { background: #fbe9e7; border-left: 3px solid #e53935; text-align: right; }
  .light .wb-risk-right { background: #e8f5e9; border-left: 3px solid #43a047; }

  .wb-footer { padding: 10px 16px; font-size: 10px; text-align: center; }
  .dark .wb-footer { border-top: 1px solid #222; color: #444; }
  .light .wb-footer { border-top: 1px solid #eee; color: #aaa; }

  /* ── 节点选中高亮指示 ─────────────────────── */
  .node-selected-indicator {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(17,17,24,0.9);
    border: 1px solid #4A90D9;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 11px;
    color: #4A90D9;
    z-index: 20;
    pointer-events: none;
    backdrop-filter: blur(10px);
  }
</style>
</head>
<body>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>STRATEGIC CANVAS</h1>
      <div class="subtitle">3D Strategy Neural Network</div>
    </div>
    <div class="stats-bar" id="stats-bar"></div>
    <div class="conversation" id="conversation"></div>
    <div class="chat-input-area">
      <div class="chat-input-wrapper">

<!-- Three.js + 3D Force Graph -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// Data Loading & State
// ═══════════════════════════════════════════════════════════════

let DATA = null;
let graphInstance = null;
let currentTurn = 6;
let autoRotate = true;
let highlightedTypes = new Set();
let allNodeTypes = new Set();
let selectedNodes = new Set();

const NODE_TYPE_LABELS = {
  goal: "Goal", position: "Position", option: "Option",
  resource: "Resource", constraint: "Constraint", tension: "Tension",
  assumption: "Assumption", risk: "Risk", signal: "Signal",
  stakeholder: "Stakeholder", mechanism: "Mechanism", evidence: "Evidence",
  pattern: "Pattern", action: "Action",
};

// Load data
fetch("graph_data.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    try { init(); } catch(e) { console.error("Init error:", e); alert("Init error: " + e.message); }
  })
  .catch(e => { console.error("Data load error:", e); alert("Failed to load graph_data.json"); });

function init() {
  renderStats();
  renderConversation();
  renderNodeSelector();
  initGraph();
  setupSlider();
  initResizers();
  // Force 3D graph to resize for 3-panel layout
  setTimeout(() => {
    const c = document.getElementById("graph-container");
    graphInstance.width(c.clientWidth).height(c.clientHeight);
  }, 100);
}

// ═══════════════════════════════════════════════════════════════
// 3D Graph
// ═══════════════════════════════════════════════════════════════

function getFilteredData(maxTurn) {
  const turnPrefix = (t) => `turn_${t}`;
  const validTurns = new Set();
  for (let i = 1; i <= maxTurn; i++) validTurns.add(turnPrefix(i));

  const nodes = DATA.graph.nodes.filter(n =>
    validTurns.has(n.source_turn_id)
  );
  const nodeIds = new Set(nodes.map(n => n.id));
  const links = DATA.graph.links.filter(e =>
    nodeIds.has(e.source) || nodeIds.has(e.source?.id)
  ).filter(e =>
    nodeIds.has(e.target) || nodeIds.has(e.target?.id)
  );

  return { nodes: JSON.parse(JSON.stringify(nodes)), links: JSON.parse(JSON.stringify(links)) };
}

function initGraph() {
  const container = document.getElementById("graph-container");
  const data = getFilteredData(currentTurn);

  graphInstance = ForceGraph3D()(container)
    .graphData(data)
    .backgroundColor("#0a0a0f")
    .width(container.clientWidth)
    .height(container.clientHeight)

    // Node appearance
    .nodeVal(n => {
      const linkCount = data.links.filter(
        l => (l.source === n.id || l.source?.id === n.id ||
              l.target === n.id || l.target?.id === n.id)
      ).length;
      return Math.max(2, linkCount * 1.5);
    })
    .nodeColor(n => {
      if (highlightedTypes.size > 0 && !highlightedTypes.has(n.node_type)) {
        return "#222";
      }
      return n.color;
    })
    .nodeOpacity(0.9)
    .nodeLabel(n => `<div style="background:rgba(0,0,0,0.8);padding:4px 8px;border-radius:4px;font-size:12px;color:#fff;border:1px solid ${n.color}">
      <div style="font-size:9px;color:${n.color};text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">${n.node_type}</div>
      <div>${n.label}</div>
      <div style="font-size:10px;color:#888;margin-top:2px">confidence: ${Math.round(n.confidence * 100)}%</div>
    </div>`)

    // Edge appearance
    .linkColor(l => {
      if (highlightedTypes.size > 0) {
        const src = typeof l.source === "object" ? l.source : data.nodes.find(n => n.id === l.source);
        const tgt = typeof l.target === "object" ? l.target : data.nodes.find(n => n.id === l.target);
        if (src && tgt && !highlightedTypes.has(src.node_type) && !highlightedTypes.has(tgt.node_type)) {
          return "rgba(50,50,50,0.1)";
        }
      }
      return l.color || "#444";
    })
    .linkWidth(l => l.strength * 2)
    .linkOpacity(0.6)
    .linkDirectionalArrowLength(4)
    .linkDirectionalArrowRelPos(1)
    .linkDirectionalParticles(l => l.strength > 0.7 ? 2 : 0)
    .linkDirectionalParticleWidth(1.5)
    .linkDirectionalParticleColor(l => l.color)

    // Edge hover labels
    .linkLabel(l => `<div style="background:rgba(0,0,0,0.85);padding:5px 10px;border-radius:4px;font-size:11px;color:#fff;border:1px solid ${l.color || '#666'};max-width:220px">
      <div style="font-size:9px;color:${l.color || '#888'};text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">${l.edge_type || ''}</div>
      <div>${l.label || ''}</div>
      <div style="font-size:10px;color:#888;margin-top:2px">strength: ${Math.round((l.strength || 0) * 100)}%</div>
    </div>`)
    .onLinkClick(l => showEdgeDetail(l))

    // Custom 3D node objects with glow + selection
    .nodeThreeObject(n => {
      const T = THREE;
      const group = new T.Group();

      // Calculate size from connections
      const linkCount = data.links.filter(
        l => (l.source === n.id || l.source?.id === n.id ||
              l.target === n.id || l.target?.id === n.id)
      ).length;
      const size = Math.max(3, linkCount * 1.2);
      const color = (highlightedTypes.size > 0 && !highlightedTypes.has(n.node_type))
        ? "#222" : n.color;

      // Glowing sphere
      const geo = new T.SphereGeometry(size, 16, 16);
      const mat = new T.MeshLambertMaterial({
        color: color,
        emissive: color,
        emissiveIntensity: n.confidence * 0.6,
        transparent: true,
        opacity: 0.9,
      });
      group.add(new T.Mesh(geo, mat));

      // Glow halo
      const glowTex = getGlowTexture();
      const glowMat = new T.SpriteMaterial({
        map: glowTex,
        color: color,
        transparent: true,
        opacity: n.confidence * 0.35,
        blending: T.AdditiveBlending,
      });
      const glow = new T.Sprite(glowMat);
      glow.scale.set(size * 5, size * 5, 1);
      group.add(glow);

      // Selection ring
      if (selectedNodes.has(n.id)) {
        const ringGeo = new T.SphereGeometry(size * 1.5, 16, 16);
        const ringMat = new T.MeshBasicMaterial({
          color: '#ffffff', wireframe: true, transparent: true, opacity: 0.35,
        });
        group.add(new T.Mesh(ringGeo, ringMat));
      }

      // Text label — high-res canvas for readability
      const cvs = document.createElement("canvas");
      const ctx = cvs.getContext("2d");
      cvs.width = 512; cvs.height = 128;
      // Background pill for contrast
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(256 - 180, 20, 360, 88, 16);
        ctx.fill();
      } else {
        ctx.fillRect(256 - 180, 20, 360, 88);
      }
      // Type label
      ctx.font = "bold 22px sans-serif";
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(n.node_type.toUpperCase(), 256, 48);
      // Main label
      ctx.font = "bold 28px sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(truncate(n.label, 20), 256, 82);
      const tex = new T.CanvasTexture(cvs);
      const lblMat = new T.SpriteMaterial({ map: tex, transparent: true, opacity: 0.95 });
      const lbl = new T.Sprite(lblMat);
      lbl.scale.set(48, 12, 1);
      lbl.position.set(0, size + 8, 0);
      group.add(lbl);

      return group;
    })

    // Interaction — click to show detail, selection is via left panel
    .onNodeClick(n => {
      showDetail(n);
    })

    // Initial camera
    .cameraPosition({ x: 300, y: 200, z: 400 });

  // Force config
  graphInstance.d3Force("charge").strength(-120);
  graphInstance.d3Force("link").distance(l => (1 - l.strength) * 80 + 30);

  // Enable auto-rotate
  if (autoRotate) {
    graphInstance.controls().autoRotate = true;
    graphInstance.controls().autoRotateSpeed = 0.5;
  }

  // Handle resize
  window.addEventListener("resize", () => {
    graphInstance.width(container.clientWidth).height(container.clientHeight);
  });
}

// Glow texture (cached)
let _glowTexture = null;
function getGlowTexture() {
  if (_glowTexture) return _glowTexture;
  const s = 128;
  const cvs = document.createElement("canvas");
  cvs.width = s; cvs.height = s;
  const ctx = cvs.getContext("2d");
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(0.2, "rgba(255,255,255,0.5)");
  g.addColorStop(0.5, "rgba(255,255,255,0.1)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  _glowTexture = new THREE.CanvasTexture(cvs);
  return _glowTexture;
}

function truncate(s, max) {
  return s.length > max ? s.slice(0, max) + "..." : s;
}

// ═══════════════════════════════════════════════════════════════
// Turn Playback
// ═══════════════════════════════════════════════════════════════

function setupSlider() {
  const slider = document.getElementById("turn-slider");
  slider.addEventListener("input", e => {
    currentTurn = parseInt(e.target.value);
    document.getElementById("turn-display").textContent = `Turn ${currentTurn}/6`;
    updateGraph();
    updateConversationHighlight();
  });
}

function updateGraph() {
  const data = getFilteredData(currentTurn);
  graphInstance.graphData(data);
  renderNodeSelector();
}

function updateConversationHighlight() {
  document.querySelectorAll(".turn").forEach(el => {
    const turn = parseInt(el.dataset.turn);
    el.style.opacity = turn <= currentTurn ? "1" : "0.2";
  });
}

// ═══════════════════════════════════════════════════════════════
// Sidebar Rendering
// ═══════════════════════════════════════════════════════════════

function renderStats() {
  const s = DATA.stats;
  document.getElementById("stats-bar").innerHTML = `
    <div class="stat"><span class="stat-dot" style="background:#4A90D9"></span>${s.total_nodes} nodes</div>
    <div class="stat"><span class="stat-dot" style="background:#50C878"></span>${s.total_edges} edges</div>
    <div class="stat"><span class="stat-dot" style="background:#F39C12"></span>${Object.keys(s.node_types).length} types</div>
  `;
}

function renderConversation() {
  const container = document.getElementById("conversation");
  container.innerHTML = DATA.conversation.map(c => `
    <div class="turn" data-turn="${c.turn}">
      <div class="turn-label user">Turn ${c.turn} — User</div>
      <div class="turn-text">${c.user}</div>
      <div style="height:8px"></div>
      <div class="turn-label coach">Coach</div>
      <div class="turn-text">${c.coach}</div>
    </div>
    <div class="turn-divider"></div>
  `).join("");
}

function renderNodeSelector() {
  const container = document.getElementById("ns-list");
  const data = getFilteredData(currentTurn);

  // Group nodes by type
  const groups = {};
  data.nodes.forEach(n => {
    if (!groups[n.node_type]) groups[n.node_type] = [];
    groups[n.node_type].push(n);
  });

  // Sort groups by a logical order
  const typeOrder = ["goal","position","tension","option","action","resource","assumption","risk","signal","evidence","mechanism","stakeholder","constraint","pattern"];
  const sortedTypes = typeOrder.filter(t => groups[t]);

  let html = '';
  sortedTypes.forEach(type => {
    const nodes = groups[type];
    const color = nodes[0].color;
    html += `<div class="ns-group-label" style="color:${color}">${NODE_TYPE_LABELS[type] || type} (${nodes.length})</div>`;
    nodes.forEach(n => {
      const sel = selectedNodes.has(n.id) ? 'selected' : '';
      const conf = Math.round((n.confidence || 0) * 100);
      html += `<div class="ns-item ${sel}" data-id="${n.id}" onclick="toggleNodeSelection('${n.id}')">
        <span class="ns-check">${sel ? '&#10003;' : ''}</span>
        <span class="ns-dot" style="background:${n.color}"></span>
        <span class="ns-label">${n.label}</span>
        <span class="ns-conf">${conf}%</span>
      </div>`;
    });
  });

  container.innerHTML = html;
}

function toggleNodeSelection(nodeId) {
  if (selectedNodes.has(nodeId)) {
    selectedNodes.delete(nodeId);
  } else {
    selectedNodes.add(nodeId);
  }
  // Update selector UI
  renderNodeSelector();
  // Update 3D selection rings
  graphInstance.nodeThreeObject(graphInstance.nodeThreeObject());
  // Update whiteboard
  renderWhiteboard();
}

// ═══════════════════════════════════════════════════════════════
// Node Detail Panel
// ═══════════════════════════════════════════════════════════════

function showDetail(node) {
  const panel = document.getElementById("node-detail");
  const typeEl = document.getElementById("detail-type");
  const labelEl = document.getElementById("detail-label");
  const contentEl = document.getElementById("detail-content");
  const metaEl = document.getElementById("detail-meta");

  typeEl.textContent = node.node_type.toUpperCase();
  typeEl.style.background = node.color + "22";
  typeEl.style.color = node.color;
  labelEl.textContent = node.label;
  contentEl.textContent = node.content;
  metaEl.innerHTML = `
    <span>Confidence: ${Math.round(node.confidence * 100)}%</span>
    <span>Source: ${node.source_turn_id}</span>
    ${node.source_skill ? `<span>Skill: ${node.source_skill}</span>` : ""}
  `;

  panel.classList.add("visible");
}

function hideDetail() {
  document.getElementById("node-detail").classList.remove("visible");
}

// ═══════════════════════════════════════════════════════════════
// Controls
// ═══════════════════════════════════════════════════════════════

function initResizers() {
  setupResizer('resizer-left', 'left');
  setupResizer('resizer-right', 'right');
}

function setupResizer(resizerId, side) {
  const resizer = document.getElementById(resizerId);
  const sidebar = document.querySelector('.sidebar');
  const wb = document.querySelector('.whiteboard-panel');

  let startX, startW;

  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    const panel = side === 'left' ? sidebar : wb;
    startX = e.clientX;
    startW = panel.getBoundingClientRect().width;
    resizer.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    const onMove = ev => {
      const dx = ev.clientX - startX;
      const newW = side === 'left' ? startW + dx : startW - dx;
      const clamped = Math.max(200, Math.min(600, newW));
      panel.style.flex = 'none';
      panel.style.width = clamped + 'px';
    };

    const onUp = () => {
      resizer.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      // Resize 3D graph
      const c = document.getElementById("graph-container");
      if (graphInstance) graphInstance.width(c.clientWidth).height(c.clientHeight);
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ═══════════════════════════════════════════════════════════════
// Board Theme Toggle
// ═══════════════════════════════════════════════════════════════

let boardTheme = 'dark'; // default blackboard

function toggleBoardTheme() {
  const panel = document.getElementById("wb-panel");
  const titleEl = document.getElementById("wb-title");
  const iconEl = document.getElementById("wb-theme-icon");

  if (boardTheme === 'dark') {
    boardTheme = 'light';
    panel.classList.remove('dark');
    panel.classList.add('light');
    titleEl.textContent = 'WHITEBOARD';
    iconEl.innerHTML = '&#9790;'; // moon
  } else {
    boardTheme = 'dark';
    panel.classList.remove('light');
    panel.classList.add('dark');
    titleEl.textContent = 'BLACKBOARD';
    iconEl.innerHTML = '&#9788;'; // sun
  }
}

function toggleRotate() {
  autoRotate = !autoRotate;
  graphInstance.controls().autoRotate = autoRotate;
  document.getElementById("btn-rotate").classList.toggle("active", autoRotate);
}

function resetCamera() {
  graphInstance.cameraPosition({ x: 300, y: 200, z: 400 }, { x: 0, y: 0, z: 0 }, 1000);
}

function exportImage() {
  const renderer = graphInstance.renderer();
  const canvas = renderer.domElement;
  const link = document.createElement("a");
  link.download = `strategic-canvas-turn-${currentTurn}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

// ═══════════════════════════════════════════════════════════════
// Edge Detail
// ═══════════════════════════════════════════════════════════════

function showEdgeDetail(link) {
  const panel = document.getElementById("node-detail");
  const typeEl = document.getElementById("detail-type");
  const labelEl = document.getElementById("detail-label");
  const contentEl = document.getElementById("detail-content");
  const metaEl = document.getElementById("detail-meta");

  const srcNode = typeof link.source === "object" ? link.source : DATA.graph.nodes.find(n => n.id === link.source);
  const tgtNode = typeof link.target === "object" ? link.target : DATA.graph.nodes.find(n => n.id === link.target);

  typeEl.textContent = (link.edge_type || "EDGE").toUpperCase();
  typeEl.style.background = (link.color || "#666") + "22";
  typeEl.style.color = link.color || "#666";
  labelEl.textContent = link.label || "Relationship";
  contentEl.textContent = `${srcNode?.label || '?'} → ${tgtNode?.label || '?'}`;
  metaEl.innerHTML = `
    <span>Strength: ${Math.round((link.strength || 0) * 100)}%</span>
    <span>Type: ${link.edge_type || 'unknown'}</span>
  `;
  panel.classList.add("visible");
}

// ═══════════════════════════════════════════════════════════════
// Node Selection Controls
// ═══════════════════════════════════════════════════════════════

function selectAllNodes() {
  const data = getFilteredData(currentTurn);
  data.nodes.forEach(n => selectedNodes.add(n.id));
  renderNodeSelector();
  graphInstance.nodeThreeObject(graphInstance.nodeThreeObject());
  renderWhiteboard();
}

function clearSelection() {
  selectedNodes.clear();
  renderNodeSelector();
  graphInstance.nodeThreeObject(graphInstance.nodeThreeObject());
  renderWhiteboard();
}

// ═══════════════════════════════════════════════════════════════
// Chat Input (Demo Mode)
// ═══════════════════════════════════════════════════════════════

function sendMessage() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;

  // Append user message to conversation display
  const container = document.getElementById("conversation");
  const turnDiv = document.createElement("div");
  turnDiv.className = "turn";
  turnDiv.innerHTML = `
    <div class="turn-label user">You</div>
    <div class="turn-text">${text}</div>
  `;
  container.appendChild(turnDiv);

  // Auto-scroll to bottom
  container.scrollTop = container.scrollHeight;
  input.value = "";

  // Demo mode: show a hint
  setTimeout(() => {
    const replyDiv = document.createElement("div");
    replyDiv.className = "turn";
    replyDiv.innerHTML = `
      <div class="turn-label coach">Coach</div>
      <div class="turn-text" style="color:#666;font-style:italic">
        [Demo mode] In production, the AI coach would analyze your input and update the 3D graph in real-time.
      </div>
    `;
    container.appendChild(replyDiv);
    container.scrollTop = container.scrollHeight;
  }, 500);
}

// Enter to send (Shift+Enter for newline)
document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("chat-input");
  if (input) {
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  }
});

// ═══════════════════════════════════════════════════════════════
// Whiteboard Rendering — Document-style HTML output
// ═══════════════════════════════════════════════════════════════

const PATTERN_LABELS = {
  full_synthesis: "Full Synthesis", decision_fork: "Decision Fork",
  assumption_stack: "Assumption Stack", action_roadmap: "Action Roadmap",
  risk_radar: "Risk Radar", resource_map: "Resource Map",
};

function getSelectedNodesData() {
  return DATA.graph.nodes.filter(n => selectedNodes.has(n.id));
}

function getSelectedEdges() {
  return DATA.graph.links.filter(l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    return selectedNodes.has(sid) && selectedNodes.has(tid);
  });
}

function detectPattern() {
  const nodes = getSelectedNodesData();
  const edges = getSelectedEdges();
  const types = new Set(nodes.map(n => n.node_type));
  const eTypes = new Set(edges.map(e => e.edge_type));
  if (types.size >= 6) return "full_synthesis";
  if (types.has("tension") && types.has("option")) return "decision_fork";
  if (types.has("assumption") && (types.has("signal") || eTypes.has("validates"))) return "assumption_stack";
  if (types.has("action") && eTypes.has("depends_on")) return "action_roadmap";
  if (types.has("risk") && (eTypes.has("amplifies") || eTypes.has("mitigates"))) return "risk_radar";
  if (types.has("resource") && eTypes.has("enables")) return "resource_map";
  return "full_synthesis";
}

function confBadge(conf) {
  const pct = Math.round((conf || 0) * 100);
  const cls = pct >= 70 ? "wb-conf-high" : pct >= 40 ? "wb-conf-mid" : "wb-conf-low";
  return `<span class="wb-card-badge ${cls}">${pct}%</span>`;
}

function nodeCard(node) {
  return `<div class="wb-card" style="border-left-color:${node.color}">
    <span class="wb-card-dot" style="background:${node.color}"></span>
    <div class="wb-card-body">
      <div class="wb-card-label">${node.label}</div>
      <div class="wb-card-desc">${node.content || ''}</div>
      ${node.source_skill ? `<div class="wb-card-meta">via ${node.source_skill}</div>` : ''}
    </div>
    ${confBadge(node.confidence)}
  </div>`;
}

function relationLine(edge, nodes) {
  const sid = typeof edge.source === "object" ? edge.source.id : edge.source;
  const tid = typeof edge.target === "object" ? edge.target.id : edge.target;
  const src = nodes.find(n => n.id === sid);
  const tgt = nodes.find(n => n.id === tid);
  if (!src || !tgt) return '';
  const color = edge.color || '#999';
  return `<div class="wb-relation">
    <span style="color:${src.color};font-weight:600">${truncate(src.label, 15)}</span>
    <span class="wb-relation-type" style="background:${color}22;color:${color}">${edge.edge_type}</span>
    <span class="wb-relation-arrow" style="color:${color}">&rarr;</span>
    <span style="color:${tgt.color};font-weight:600">${truncate(tgt.label, 15)}</span>
  </div>`;
}

function sectionBlock(title, content) {
  return `<div class="wb-section">
    <div class="wb-section-title">${title}</div>
    ${content}
  </div>`;
}

function verdictBlock(text) {
  return `<div class="wb-verdict">
    <div class="wb-verdict-label">Verdict</div>
    <div class="wb-verdict-text">${text}</div>
  </div>`;
}

function renderWhiteboard() {
  const container = document.getElementById("wb-body");
  const badge = document.getElementById("wb-pattern-badge");
  const countEl = document.getElementById("wb-count");
  const footerEl = document.getElementById("wb-footer");

  if (selectedNodes.size === 0) {
    container.innerHTML = '<div class="wb-empty">Select nodes in the left panel to build strategic analysis</div>';
    badge.textContent = "No Selection";
    countEl.textContent = "0 nodes selected";
    footerEl.textContent = "Strategic Canvas";
    return;
  }

  const nodes = getSelectedNodesData();
  const edges = getSelectedEdges();
  const pattern = detectPattern();

  countEl.textContent = `${nodes.length} nodes, ${edges.length} edges`;
  badge.textContent = PATTERN_LABELS[pattern] || pattern;

  let html;
  switch (pattern) {
    case "decision_fork": html = renderDecisionFork(nodes, edges); break;
    case "assumption_stack": html = renderAssumptionStack(nodes, edges); break;
    case "action_roadmap": html = renderActionRoadmap(nodes, edges); break;
    case "risk_radar": html = renderRiskRadar(nodes, edges); break;
    case "resource_map": html = renderResourceMap(nodes, edges); break;
    default: html = renderFullSynthesis(nodes, edges);
  }

  container.innerHTML = `<div class="wb-doc">${html}</div>`;
  footerEl.textContent = `Strategic Canvas \u00b7 ${nodes.length} elements \u00b7 ${new Date().toLocaleDateString()}`;
}

// ── Layout A: Decision Fork ─────────────────────────────────

function renderDecisionFork(nodes, edges) {
  const tensions = nodes.filter(n => n.node_type === "tension");
  const options = nodes.filter(n => n.node_type === "option");
  const others = nodes.filter(n => n.node_type !== "tension" && n.node_type !== "option");
  const mainTension = tensions[0];

  let html = `<div class="wb-doc-title">Decision Fork Analysis</div>
    <div class="wb-doc-subtitle">${nodes.length} elements analyzed</div>`;

  // Core tension
  if (mainTension) {
    html += sectionBlock("Core Tension", nodeCard(mainTension));
  }
  if (tensions.length > 1) {
    html += sectionBlock("Related Tensions", tensions.slice(1).map(nodeCard).join(''));
  }

  // Fork options
  if (options.length > 0) {
    let forkHtml = '<div class="wb-fork-container">';
    options.forEach((o, i) => {
      const relEdges = edges.filter(e => involvesNode(e, o.id));
      const supports = relEdges.filter(e => e.edge_type === 'supports' || e.edge_type === 'enables').length;
      const blocks = relEdges.filter(e => e.edge_type === 'contradicts' || e.edge_type === 'blocks').length;
      forkHtml += `<div class="wb-fork-option" style="border-color:${o.color}">
        <div style="font-size:9px;color:${o.color};font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Option ${i + 1}</div>
        <div class="wb-fork-label">${o.label}</div>
        <div class="wb-fork-desc">${o.content || ''}</div>
        <div style="margin-top:6px;font-size:10px;color:#888">${confBadge(o.confidence)}
          ${supports ? `<span style="color:#4CAF50;margin-left:6px">+${supports} support</span>` : ''}
          ${blocks ? `<span style="color:#F44336;margin-left:6px">-${blocks} block</span>` : ''}
        </div>
      </div>`;
    });
    forkHtml += '</div>';
    html += sectionBlock("Available Options", forkHtml);
  }

  // Supporting factors
  if (others.length > 0) {
    html += sectionBlock("Context & Constraints", others.map(nodeCard).join(''));
  }

  // Key relationships
  if (edges.length > 0) {
    html += sectionBlock("Key Relationships", edges.slice(0, 6).map(e => relationLine(e, nodes)).join(''));
  }

  // Verdict
  const bestOption = options.sort((a, b) => (b.confidence || 0) - (a.confidence || 0))[0];
  html += verdictBlock(
    mainTension
      ? `Core tension: "${mainTension.label}". ${options.length} options identified. ${bestOption ? `Strongest option: "${bestOption.label}" (${Math.round(bestOption.confidence * 100)}% confidence).` : ''}`
      : `${options.length} decision paths under consideration.`
  );

  return html;
}

// ── Layout B: Assumption Stack ──────────────────────────────

function renderAssumptionStack(nodes, edges) {
  const assumptions = nodes.filter(n => n.node_type === "assumption");
  const signals = nodes.filter(n => n.node_type === "signal");
  const evidence = nodes.filter(n => n.node_type === "evidence");
  const others = nodes.filter(n => !["assumption", "signal", "evidence"].includes(n.node_type));

  let html = `<div class="wb-doc-title">Assumption Validation</div>
    <div class="wb-doc-subtitle">${assumptions.length} assumptions, ${signals.length} signals</div>`;

  // Assumptions with validation status
  if (assumptions.length > 0) {
    let assHtml = '';
    assumptions.forEach(a => {
      const validatingEdges = edges.filter(e =>
        e.edge_type === 'validates' && involvesNode(e, a.id)
      );
      const contradictEdges = edges.filter(e =>
        e.edge_type === 'contradicts' && involvesNode(e, a.id)
      );
      const status = contradictEdges.length > 0 ? 'Challenged' :
                     validatingEdges.length > 0 ? 'Has signals' : 'Unvalidated';
      const statusColor = contradictEdges.length > 0 ? '#c62828' :
                          validatingEdges.length > 0 ? '#2e7d32' : '#e65100';

      assHtml += `<div class="wb-card" style="border-left-color:${a.color}">
        <span class="wb-card-dot" style="background:${a.color}"></span>
        <div class="wb-card-body">
          <div class="wb-card-label">${a.label}</div>
          <div class="wb-card-desc">${a.content || ''}</div>
          <div class="wb-card-meta" style="color:${statusColor};font-weight:600">${status}${validatingEdges.length ? ` (${validatingEdges.length} signals)` : ''}</div>
        </div>
        ${confBadge(a.confidence)}
      </div>`;
    });
    html += sectionBlock("Key Assumptions", assHtml);
  }

  // Validation signals
  if (signals.length > 0) {
    html += sectionBlock("Validation Signals", signals.map(nodeCard).join(''));
  }

  // Evidence
  if (evidence.length > 0) {
    html += sectionBlock("Supporting Evidence", evidence.map(nodeCard).join(''));
  }

  // Other context
  if (others.length > 0) {
    html += sectionBlock("Related Elements", others.map(nodeCard).join(''));
  }

  // Verdict
  const unvalidated = assumptions.filter(a => {
    return !edges.some(e => e.edge_type === 'validates' && involvesNode(e, a.id));
  });
  html += verdictBlock(
    `${assumptions.length} key assumptions identified. ${unvalidated.length > 0 ? `${unvalidated.length} remain unvalidated and require testing.` : 'All have validation signals.'} ${signals.length} early indicators being tracked.`
  );

  return html;
}

// ── Layout C: Action Roadmap ────────────────────────────────

function renderActionRoadmap(nodes, edges) {
  const actions = nodes.filter(n => n.node_type === "action");
  const others = nodes.filter(n => n.node_type !== "action");

  // Topological sort by depends_on
  const depEdges = edges.filter(e => e.edge_type === "depends_on");
  const sorted = topoSort(actions, depEdges);

  let html = `<div class="wb-doc-title">Action Roadmap</div>
    <div class="wb-doc-subtitle">${actions.length} steps identified</div>`;

  // Steps
  if (sorted.length > 0) {
    let stepsHtml = '';
    sorted.forEach((a, i) => {
      stepsHtml += `<div class="wb-flow-step">
        <div class="wb-flow-num" style="background:${a.color}">${i + 1}</div>
        <div class="wb-flow-content">
          <div class="wb-flow-label">${a.label} ${confBadge(a.confidence)}</div>
          <div class="wb-flow-desc">${a.content || ''}</div>
          ${a.source_skill ? `<div style="font-size:10px;color:#aaa;margin-top:2px">via ${a.source_skill}</div>` : ''}
        </div>
      </div>`;
    });
    html += sectionBlock("Recommended Sequence", stepsHtml);
  }

  // Dependencies
  if (depEdges.length > 0) {
    html += sectionBlock("Dependencies", depEdges.map(e => relationLine(e, nodes)).join(''));
  }

  // Supporting context
  if (others.length > 0) {
    html += sectionBlock("Prerequisites & Context", others.map(nodeCard).join(''));
  }

  // Verdict
  html += verdictBlock(
    `${sorted.length}-step action plan. First step: "${sorted[0]?.label || '?'}". ${depEdges.length} dependencies identified.`
  );

  return html;
}

// ── Layout D: Risk Radar ────────────────────────────────────

function renderRiskRadar(nodes, edges) {
  const risks = nodes.filter(n => n.node_type === "risk");
  const others = nodes.filter(n => n.node_type !== "risk");

  let html = `<div class="wb-doc-title">Risk Analysis</div>
    <div class="wb-doc-subtitle">${risks.length} risks identified</div>`;

  // Risk cards with amplifiers/mitigators
  if (risks.length > 0) {
    let riskHtml = '';
    risks.forEach(r => {
      const ampEdges = edges.filter(e => e.edge_type === 'amplifies' && involvesNode(e, r.id));
      const mitEdges = edges.filter(e => e.edge_type === 'mitigates' && involvesNode(e, r.id));

      riskHtml += `<div class="wb-card" style="border-left-color:${r.color}">
        <span class="wb-card-dot" style="background:${r.color}"></span>
        <div class="wb-card-body">
          <div class="wb-card-label">${r.label}</div>
          <div class="wb-card-desc">${r.content || ''}</div>`;

      if (ampEdges.length > 0 || mitEdges.length > 0) {
        riskHtml += `<div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">`;
        ampEdges.forEach(e => {
          const other = getOtherNode(e, r.id, nodes);
          if (other) riskHtml += `<span style="font-size:10px;color:#c62828;background:#fbe9e7;padding:1px 6px;border-radius:4px">&uarr; ${truncate(other.label, 12)}</span>`;
        });
        mitEdges.forEach(e => {
          const other = getOtherNode(e, r.id, nodes);
          if (other) riskHtml += `<span style="font-size:10px;color:#2e7d32;background:#e8f5e9;padding:1px 6px;border-radius:4px">&darr; ${truncate(other.label, 12)}</span>`;
        });
        riskHtml += `</div>`;
      }
      riskHtml += `</div>${confBadge(r.confidence)}</div>`;
    });
    html += sectionBlock("Risk Assessment", riskHtml);
  }

  // Amplifiers vs Mitigators summary
  const ampNodes = [], mitNodes = [], neutralNodes = [];
  others.forEach(n => {
    const isAmp = edges.some(e => e.edge_type === 'amplifies' && involvesNode(e, n.id));
    const isMit = edges.some(e => e.edge_type === 'mitigates' && involvesNode(e, n.id));
    if (isAmp) ampNodes.push(n);
    else if (isMit) mitNodes.push(n);
    else neutralNodes.push(n);
  });

  if (ampNodes.length > 0 || mitNodes.length > 0) {
    let balanceHtml = '';
    const maxRows = Math.max(ampNodes.length, mitNodes.length);
    for (let i = 0; i < maxRows; i++) {
      balanceHtml += `<div class="wb-risk-row">
        <div class="wb-risk-left">${ampNodes[i] ? `<span style="font-weight:600">${ampNodes[i].label}</span>` : ''}</div>
        <div class="wb-risk-center">${ampNodes[i] || mitNodes[i] ? '&harr;' : ''}</div>
        <div class="wb-risk-right">${mitNodes[i] ? `<span style="font-weight:600">${mitNodes[i].label}</span>` : ''}</div>
      </div>`;
    }
    html += sectionBlock("Risk Amplifiers vs Mitigators", balanceHtml);
  }

  if (neutralNodes.length > 0) {
    html += sectionBlock("Related Factors", neutralNodes.map(nodeCard).join(''));
  }

  // Verdict
  const highRisks = risks.filter(r => r.confidence >= 0.7);
  html += verdictBlock(
    `${risks.length} risks mapped. ${highRisks.length} rated high-confidence. ${mitNodes.length} mitigating factors identified against ${ampNodes.length} amplifiers.`
  );

  return html;
}

// ── Layout E: Resource Map ──────────────────────────────────

function renderResourceMap(nodes, edges) {
  const resources = nodes.filter(n => n.node_type === "resource");
  const targets = nodes.filter(n => n.node_type !== "resource");

  let html = `<div class="wb-doc-title">Resource Map</div>
    <div class="wb-doc-subtitle">${resources.length} resources, ${targets.length} targets</div>`;

  // Resources
  if (resources.length > 0) {
    html += sectionBlock("Available Resources", resources.map(nodeCard).join(''));
  }

  // Resource → Target connections
  if (edges.length > 0) {
    html += sectionBlock("Resource Utilization", edges.slice(0, 8).map(e => relationLine(e, nodes)).join(''));
  }

  // Targets
  if (targets.length > 0) {
    html += sectionBlock("Enabled Targets", targets.map(nodeCard).join(''));
  }

  // Verdict
  const enableEdges = edges.filter(e => e.edge_type === 'enables');
  const unusedRes = resources.filter(r => !edges.some(e => involvesNode(e, r.id)));
  html += verdictBlock(
    `${resources.length} resources identified. ${enableEdges.length} enabling relationships. ${unusedRes.length > 0 ? `${unusedRes.length} resources not yet leveraged.` : 'All resources connected to targets.'}`
  );

  return html;
}

// ── Layout F: Full Synthesis ────────────────────────────────

function renderFullSynthesis(nodes, edges) {
  const SECTION_ORDER = [
    { key: "goal", title: "Strategic Goal", icon: "north_star" },
    { key: "position", title: "Strategic Position" },
    { key: "tension", title: "Core Tensions" },
    { key: "option", title: "Strategic Options" },
    { key: "action", title: "Recommended Actions" },
    { key: "resource", title: "Resources & Capabilities" },
    { key: "assumption", title: "Key Assumptions" },
    { key: "risk", title: "Risks & Threats" },
    { key: "signal", title: "Validation Signals" },
    { key: "evidence", title: "Evidence Base" },
    { key: "mechanism", title: "Strategic Mechanisms" },
    { key: "stakeholder", title: "Stakeholders" },
    { key: "constraint", title: "Constraints" },
    { key: "pattern", title: "Strategic Patterns" },
  ];

  const goal = nodes.find(n => n.node_type === "goal");
  const avgConf = Math.round(nodes.reduce((s, n) => s + (n.confidence || 0), 0) / nodes.length * 100);

  let html = `<div class="wb-doc-title">Strategic Synthesis</div>
    <div class="wb-doc-subtitle">${nodes.length} elements \u00b7 ${edges.length} relationships \u00b7 Avg confidence: ${avgConf}%</div>`;

  // Goal highlight at top
  if (goal) {
    html += `<div class="wb-verdict" style="margin-bottom:20px;border-color:${goal.color}44;background:${goal.color}08">
      <div class="wb-verdict-label" style="color:${goal.color}">Strategic Goal</div>
      <div class="wb-verdict-text">${goal.label}</div>
      <div style="font-size:12px;color:#666;margin-top:4px">${goal.content || ''}</div>
    </div>`;
  }

  // Sections
  SECTION_ORDER.forEach(sec => {
    if (sec.key === "goal" && goal) return; // already shown above
    const sectionNodes = nodes.filter(n => n.node_type === sec.key)
      .sort((a, b) => (b.weight || 1) - (a.weight || 1));
    if (sectionNodes.length === 0) return;
    html += sectionBlock(sec.title, sectionNodes.map(nodeCard).join(''));
  });

  // Key relationships
  if (edges.length > 0) {
    const importantEdges = edges.filter(e =>
      ['contradicts', 'blocks', 'tradeoff', 'enables', 'supports'].includes(e.edge_type)
    ).slice(0, 8);
    if (importantEdges.length === 0) importantEdges.push(...edges.slice(0, 6));
    html += sectionBlock("Key Relationships", importantEdges.map(e => relationLine(e, nodes)).join(''));
  }

  // Verdict
  const tensions = nodes.filter(n => n.node_type === "tension");
  const actions = nodes.filter(n => n.node_type === "action");
  const risks = nodes.filter(n => n.node_type === "risk");
  const verdictParts = [];
  if (goal) verdictParts.push(`Goal: "${goal.label}"`);
  if (tensions.length) verdictParts.push(`${tensions.length} core tensions to resolve`);
  if (actions.length) verdictParts.push(`${actions.length} action steps identified`);
  if (risks.length) verdictParts.push(`${risks.length} risks to monitor`);
  verdictParts.push(`Overall confidence: ${avgConf}%`);
  html += verdictBlock(verdictParts.join('. ') + '.');

  return html;
}

// ── Helpers ────────────────────────────────────────────────

function topoSort(nodes, depEdges) {
  // Simple topological sort for action sequences
  const ids = new Set(nodes.map(n => n.id));
  const inDeg = {};
  const adj = {};
  nodes.forEach(n => { inDeg[n.id] = 0; adj[n.id] = []; });
  depEdges.forEach(e => {
    const sid = typeof e.source === "object" ? e.source.id : e.source;
    const tid = typeof e.target === "object" ? e.target.id : e.target;
    if (ids.has(sid) && ids.has(tid)) {
      // sid depends_on tid → tid comes first
      adj[tid] = adj[tid] || [];
      adj[tid].push(sid);
      inDeg[sid] = (inDeg[sid] || 0) + 1;
    }
  });
  const queue = nodes.filter(n => (inDeg[n.id] || 0) === 0);
  const result = [];
  while (queue.length > 0) {
    const n = queue.shift();
    result.push(n);
    (adj[n.id] || []).forEach(nextId => {
      inDeg[nextId]--;
      if (inDeg[nextId] === 0) {
        const nextNode = nodes.find(x => x.id === nextId);
        if (nextNode) queue.push(nextNode);
      }
    });
  }
  // Add any remaining (cycles)
  nodes.forEach(n => { if (!result.find(r => r.id === n.id)) result.push(n); });
  return result;
}

function getOtherNode(edge, nodeId, nodes) {
  const sid = typeof edge.source === "object" ? edge.source.id : edge.source;
  const tid = typeof edge.target === "object" ? edge.target.id : edge.target;
  const otherId = sid === nodeId ? tid : sid;
  return nodes.find(n => n.id === otherId);
}

// ── Edge helpers ────────────────────────────────────────────

function involvesNode(edge, nodeId) {
  const s = typeof edge.source === "object" ? edge.source.id : edge.source;
  const t = typeof edge.target === "object" ? edge.target.id : edge.target;
  return s === nodeId || t === nodeId;
}

function relatesToBoth(edge, id1, id2) {
  const s = typeof edge.source === "object" ? edge.source.id : edge.source;
  const t = typeof edge.target === "object" ? edge.target.id : edge.target;
  return (s === id1 && t === id2) || (s === id2 && t === id1);
}

function exportWhiteboard() {
  const wbDoc = document.querySelector(".wb-doc");
  if (!wbDoc) { alert("No whiteboard content to export"); return; }

  // Use html2canvas-like approach: render to a hidden iframe then capture
  // Simpler approach: copy HTML to a new window for print/save
  const printWin = window.open('', '_blank', 'width=800,height=600');
  printWin.document.write(`<!DOCTYPE html><html><head><title>Strategic Canvas Summary</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 40px; max-width: 700px; margin: 0 auto; color: #333; }
      ${document.querySelector('style').textContent}
      @media print { body { padding: 20px; } }
    </style></head><body>${wbDoc.outerHTML}</body></html>`);
  printWin.document.close();
  setTimeout(() => printWin.print(), 300);
}
